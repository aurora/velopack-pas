name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Library units + FPCUnit suite against the C stub of the native library.
  test:
    name: FPC tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal and a C compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc gcc
      - name: Run tests
        run: tests/run-tests.sh
      - name: Build console example
        run: |
          fpc -Mdelphi -Fusrc -FUbuild/units -FEbuild examples/console/ConsoleDemo.lpr

  # Lazarus package and the LCL example (compile only, no display needed).
  lazarus:
    name: Lazarus package and LCL example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lazarus
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc lazarus-ide-gtk2 lcl-nogui lcl-units
      - name: Build package
        run: lazbuild packages/lazarus/velopack_pas.lpk
      - name: Build LCL example
        run: lazbuild examples/lcl/UpdaterDemo.lpi

  # Builds the real Velopack native library from the pinned revision, checks that
  # the vendored header has not drifted and runs the suite incl. smoke tests.
  real-library:
    name: Tests against the real Velopack library (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Velopack revision
        id: pin
        run: echo "commit=$(sed -n 's/^commit=//p' third_party/velopack/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: velopack/velopack
          ref: ${{ steps.pin.outputs.commit }}
          path: velopack-src
      - name: Vendored header matches the pinned revision
        run: diff -u third_party/velopack/Velopack.h velopack-src/src/lib-cpp/include/Velopack.h
      - name: Install Free Pascal and a C compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc gcc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: velopack-src
      - name: Build native library
        run: cargo build --release -p velopack_libc
        working-directory: velopack-src
      - name: Run tests
        run: tests/run-tests.sh
        env:
          VELOPACK_REAL_LIB: ${{ github.workspace }}/velopack-src/target/release/libvelopack_libc.so

  # EXPERIMENTAL: Windows is where Velopack installs and updates apps, but this
  # job has not been proven yet. It must not fail the whole workflow until it
  # is stable (then remove continue-on-error). Uses MSYS2 so that the Free Pascal
  # compiler and the C compiler for the test stub are both 64-bit.
  # Not covered yet: Lazarus package / LCL example on Windows.
  windows:
    name: FPC tests (Windows, experimental)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-fpc
            mingw-w64-x86_64-gcc
      - name: Show toolchain
        run: |
          fpc -iV -iTP -iTO
          gcc --version | head -1
      - name: Run tests
        run: tests/run-tests.sh
      - name: Build console example
        run: |
          mkdir -p build/units
          fpc -Mdelphi -Fusrc -FUbuild/units -FEbuild examples/console/ConsoleDemo.lpr
