name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Library units + FPCUnit suite against the C stub of the native library.
  test:
    name: FPC tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal and a C compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc gcc
      - name: Run tests
        run: tests/run-tests.sh
      - name: Build console example
        run: |
          fpc -Mdelphi -Fusrc -FUbuild/units -FEbuild examples/console/ConsoleDemo.lpr

  # Lazarus package and the LCL example (compile only, no display needed).
  lazarus:
    name: Lazarus package and LCL example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lazarus
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc lazarus-ide-gtk2 lcl-nogui lcl-units
      - name: Build package
        run: lazbuild packages/lazarus/velopack_pas.lpk
      - name: Build LCL example
        run: lazbuild examples/lcl/UpdaterDemo.lpi

  # Builds the real Velopack native library from the pinned revision, checks that
  # the vendored header has not drifted and runs the suite incl. smoke tests.
  real-library:
    name: Tests against the real Velopack library (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Velopack revision
        id: pin
        run: echo "commit=$(sed -n 's/^commit=//p' third_party/velopack/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: velopack/velopack
          ref: ${{ steps.pin.outputs.commit }}
          path: velopack-src
      - name: Vendored header matches the pinned revision
        run: diff -u third_party/velopack/Velopack.h velopack-src/src/lib-cpp/include/Velopack.h
      - name: Install Free Pascal and a C compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc gcc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: velopack-src
      - name: Build native library
        run: cargo build --release -p velopack_libc
        working-directory: velopack-src
      - name: Run tests
        run: tests/run-tests.sh
        env:
          VELOPACK_REAL_LIB: ${{ github.workspace }}/velopack-src/target/release/libvelopack_libc.so

  # EXPERIMENTAL: Windows is where Velopack installs and updates apps, but this
  # job has not been proven yet. It must not fail the whole workflow until it
  # is stable (then remove continue-on-error).
  # Toolchain: 32-bit Free Pascal (choco) + 32-bit GCC (MSYS2 MINGW32) so that
  # the test program and the C stub have the same architecture.
  # Passed once its toolchain problems were sorted out; keep continue-on-error
  # until it has proven stable (the FPC/choco install is slow and can flake).
  # The real library is built as 32-bit (i686-pc-windows-msvc) to match the
  # 32-bit FPC; a 64-bit FPC would allow testing the 64-bit DLL as well.
  # Not covered yet: 64-bit, Lazarus package / LCL example.
  windows:
    name: FPC tests + real library (Windows 32-bit, experimental)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal
        shell: pwsh
        timeout-minutes: 10
        run: |
          # choco installs fine in ~20 s, but a process left behind by the FPC
          # installer keeps an inherited stdout pipe open and the step never
          # returns. Redirect to files so no pipe is inherited.
          Start-Process choco -ArgumentList 'install','freepascal','-y','--no-progress' `
            -Wait -NoNewWindow -RedirectStandardOutput choco.out -RedirectStandardError choco.err
          Get-Content choco.out -Tail 5
          $bin = 'C:\tools\freepascal\bin\i386-win32'
          if (-not (Test-Path "$bin\fpc.exe")) { throw "fpc.exe not found in $bin" }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: false
          path-type: inherit
          install: >-
            mingw-w64-i686-gcc
      - name: Show toolchain
        shell: msys2 {0}
        run: |
          fpc -iV -iTP -iTO
          gcc --version | head -1
      - name: Run tests
        shell: msys2 {0}
        # The choco FPC finds the RTL but not the FCL units (no fpc.cfg).
        env:
          FPC_OPTS: -FuC:/tools/freepascal/units/i386-win32/*
        # One suite at a time with a timeout: the whole run hung once on
        # Windows and the runner prints nothing until the end, so this shows
        # which suite is the culprit.
        run: |
          status=0
          for suite in TStringTests TNativeTests TManagerTests TAppTests TLogTests TUpdaterTests; do
            echo "=== $suite"
            timeout 60 tests/run-tests.sh --suite=$suite || { echo "FAILED or timed out: $suite (exit $?)"; status=1; }
          done
          exit $status
      - name: Build console example
        shell: msys2 {0}
        run: |
          mkdir -p build/units
          fpc -Mdelphi -Fusrc -FUbuild/units -FEbuild examples/console/ConsoleDemo.lpr
      - name: Read pinned Velopack revision
        id: pin
        shell: bash
        run: echo "commit=$(sed -n 's/^commit=//p' third_party/velopack/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: velopack/velopack
          ref: ${{ steps.pin.outputs.commit }}
          path: velopack-src
      - name: Add the 32-bit Rust target
        shell: pwsh
        run: rustup target add i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: velopack-src
      - name: Build the native library (32-bit)
        shell: pwsh
        working-directory: velopack-src
        env:
          # Same as upstream's release build: no dependency on the VC runtime DLL.
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release -p velopack_libc --target i686-pc-windows-msvc
          Get-Item target\i686-pc-windows-msvc\release\velopack_libc.dll | Format-List FullName, Length
      - name: Tests against the real library
        shell: msys2 {0}
        env:
          FPC_OPTS: -FuC:/tools/freepascal/units/i386-win32/*
          # Forward slashes: the path goes through MSYS into a native program.
          VELOPACK_REAL_LIB: ${{ replace(github.workspace, '\', '/') }}/velopack-src/target/i686-pc-windows-msvc/release/velopack_libc.dll
        run: |
          echo "real library: $VELOPACK_REAL_LIB"
          timeout 120 tests/run-tests.sh --suite=TRealLibraryTests
